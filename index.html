<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Oxbridge Chess</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <img id="schoolLogo" src="assets/logo/logo.png" alt="Oxbridge logo" />
        <div>
          <p class="kicker">OXBRIDGE</p>
          <h1>Chess Academy</h1>
        </div>
      </div>
      <div class="status">
        <p id="turnIndicator">White to move</p>
        <p id="gameStatus">Game in progress.</p>
      </div>
    </header>

    <section class="controls">
      <label>
        Mode
        <select id="modeSelect">
          <option value="ai">Player vs Computer</option>
          <option value="local">Local 2 Player</option>
        </select>
      </label>
      <label>
        AI Level
        <select id="difficultySelect">
          <option value="1">Easy</option>
          <option value="2" selected>Medium</option>
          <option value="3">Hard</option>
        </select>
      </label>
      <div class="buttons">
        <button id="undoBtn">Undo</button>
        <button id="restartBtn">Restart</button>
        <button id="fullscreenBtn">Fullscreen</button>
        <!-- Return button implementation: quick navigation back to the games hub. -->
        <a class="button-link" href="/games">Return to Games</a>
      </div>
    </section>

    <!-- Board styling layer: framed board with square-based interaction. -->
    <section class="board-shell">
      <div class="board-frame">
        <div id="board" class="board" role="grid" aria-label="Chess board"></div>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
