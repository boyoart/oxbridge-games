<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Oxbridge Ludo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="screen" id="screen">
    <section id="setupScreen" class="setup-card">
      <h1>Oxbridge Ludo</h1>
      <p class="setup-copy">Easy: capturing sends enemy to base and your token directly home. Hard: capturing sends enemy to base but your token stays on board.</p>
      <div class="setup-row">
        <label for="playerName">Your Name</label>
        <input id="playerName" maxlength="20" placeholder="Enter name" />
      </div>
      <div class="setup-row">
        <label for="difficulty">Difficulty</label>
        <select id="difficulty">
          <option value="easy">Easy</option>
          <option value="hard">Hard</option>
        </select>
      </div>
      <div class="setup-actions">
        <button id="singleBtn">Single Player</button>
        <button id="localBtn">Local Multiplayer</button>
        <button id="createRoomBtn">Create Online Room</button>
      </div>
      <div class="setup-row inline">
        <input id="roomCodeInput" maxlength="6" placeholder="Room code" />
        <button id="joinRoomBtn">Join Room</button>
      </div>
      <button id="startOnlineBtn" class="hidden">Start Online Match</button>
      <p id="connectionStatus">Connection: Offline</p>
    </section>

    <section id="gameScreen" class="hidden game-shell">
      <header class="top-hud">
        <div class="brand-wrap" id="brandWrap">
          <img id="brandLogo" class="brand-logo" src="assets/logo/logo.png" alt="Oxbridge logo" />
          <div id="brandFallback" class="brand-fallback hidden">Oxbridge Tutorial College</div>
        </div>
        <div id="turnBanner" class="turn-banner">Waiting...</div>
        <div class="controls">
          <button id="restartBtn">Restart</button>
          <button id="fullscreenBtn">Fullscreen</button>
          <button id="soundToggleBtn">Sound On</button>
          <a href="/games">Return to Games</a>
        </div>
      </header>

      <section id="playerChips" class="player-chips"></section>

      <section class="ludo-main-layout">
        <div class="ludo-board-area">
          <section class="board-shell">
            <div id="board" class="board"></div>
            <div id="centerHomeLogo" class="center-home-logo" aria-hidden="true">
              <img src="assets/logo/logo.png" alt="" />
            </div>
            <div class="dice-tray" aria-hidden="true"></div>
            <button id="diceCenter" class="dice-center" aria-label="Roll dice">
              <div id="dieA" class="die"></div>
              <div id="dieB" class="die"></div>
            </button>
            <div id="guideHand" class="guide-hand hidden">🤚</div>
          </section>
        </div>
        <!-- Desktop side panel is created here and keeps all side data in one grouped column. -->
        <aside id="leftPanel" class="panel compact-panel ludo-side-panel">
          <!-- Grouped side panel sections are mounted here: Placements + Shared Victory + Token Status. -->
          <div id="placementsPanel"></div>
          <div id="victoryWrap" class="victory-wrap">
            <h3>Victory</h3>
            <div id="victoryContainer" class="victory-container"></div>
          </div>
          <div id="statusPanel" class="status-panel-block"></div>
        </aside>
      </section>

      <!-- Desktop bottom ball bar is fixed in CSS so the three move balls remain docked to viewport bottom. -->
      <section class="ludo-bottom-ball-bar">
        <div class="bottom-balls" id="ballTray">
          <!-- UI label wording standardized for the two-dice system: use "Dice" consistently in player-facing text. -->
          <button data-ball="a" class="ball disabled"><span>Dice 1</span><strong>0</strong></button>
          <button data-ball="b" class="ball disabled"><span>Dice 2</span><strong>0</strong></button>
          <button data-ball="sum" class="ball disabled"><span>Sum</span><strong>0</strong></button>
        </div>
      </section>

      <section class="turn-dock">
        <button id="timerBubble" class="dock-mini" aria-label="Turn timer">20</button>
        <div id="turnPill" class="turn-pill">Your Turn</div>
        <button id="helpBtn" class="dock-mini" aria-label="Help">?</button>
      </section>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
